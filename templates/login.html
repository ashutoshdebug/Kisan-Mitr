<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan Mitra | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

<header class="navbar">
    <a href="{{ url_for('landingPage') }}" class="brand">
        <img class="brand-icon" src="{{ url_for('static', filename='uploads/images/kisan-logo.png') }}" alt="Kisan Mitra logo">
        <span><b>Kisan Mitra</b><small>AI CROP HEALTH</small></span>
    </a>
    <a href="{{ url_for('landingPage') }}" class="back" data-i18n="backHome">← Back to home</a>
</header>

<main class="login-main">
    <div class="login-intro reveal">
        <span data-i18n="welcome">WELCOME BACK</span>
        <h1 data-i18n="introTitle">Let's grow<br><em>smarter.</em></h1>
        <p data-i18n="introDesc">Sign in to continue to the Kisan Mitra crop disease detector.</p>

        <div class="login-orbit">
            <img src="{{ url_for('static', filename='uploads/images/kisan-logo.png') }}" alt="Kisan Mitra logo">
        </div>
    </div>

    <div class="login-box reveal delay">
        <small data-i18n="accountAccess">ACCOUNT ACCESS</small>
        <h2 data-i18n="signIn">Sign in.</h2>

        <form>
            <label data-i18n="emailLabel">Email</label>
            <input type="email" placeholder="you@example.com" data-i18n-placeholder="emailPlaceholder" required>

            <label data-i18n="passwordLabel">Password</label>
            <input type="password" placeholder="Enter your password" data-i18n-placeholder="passwordPlaceholder" required>

            <div class="options">
                <label><input type="checkbox"> <span data-i18n="remember">Remember me</span></label>
                <a href="#" data-i18n="forgot">Forgot password?</a>
            </div>

            <button type="submit" data-i18n="continueBtn">CONTINUE <span>↗</span></button>
        </form>

        <p class="create" data-i18n="createAccount">New to Kisan Mitra? <a href="#">Create an account</a></p>
    </div>
</main>

<script>
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('show');
    });
}, { threshold: 0.15 });

document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

const translations = {
    hi: {
        backHome:'← होम पर वापस जाएँ', welcome:'वापसी पर स्वागत है',
        introTitle:'आइए आगे बढ़ें<br><em>और बेहतर उगाएँ।</em>',
        introDesc:'किसान मित्र के फसल रोग पहचान सिस्टम को जारी रखने के लिए साइन इन करें।',
        accountAccess:'खाता पहुँच', signIn:'साइन इन करें।', emailLabel:'ईमेल', passwordLabel:'पासवर्ड',
        remember:'मुझे याद रखें', forgot:'पासवर्ड भूल गए?', continueBtn:'जारी रखें <span>↗</span>',
        createAccount:'किसान मित्र में नए हैं? <a href="#">खाता बनाएँ</a>',
        emailPlaceholder:'आपका ईमेल', passwordPlaceholder:'अपना पासवर्ड दर्ज करें'
    }
};
function applyHindi(){
    document.documentElement.lang='hi';
    document.body.classList.add('hindi');
    document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key=el.dataset.i18n; if(translations.hi[key]) el.innerHTML=translations.hi[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
        const key=el.dataset.i18nPlaceholder; if(translations.hi[key]) el.placeholder=translations.hi[key];
    });
}
if(localStorage.getItem('kmLanguage')==='hi') applyHindi();
</script>

</body>
</html>
