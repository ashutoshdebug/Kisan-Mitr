<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisan Mitra — Crop Detection</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#f4f3e9;color:#102d1e;font-family:'DM Sans',sans-serif}
.page{width:min(1200px,92%);margin:auto;min-height:100vh;display:flex;flex-direction:column}
nav{height:92px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#102d1e}
.brand img{width:52px;height:52px;object-fit:contain}
.brand strong{font-size:18px;display:block;letter-spacing:-.4px}
.brand span{font-size:8px;letter-spacing:2px;color:#758278}
.nav-links{display:flex;gap:38px;font-size:12px;color:#34463c}
.nav-links a{text-decoration:none;color:inherit}
.login{border:1px solid #cbd1c8;border-radius:24px;padding:11px 22px;text-decoration:none;color:#183426;font-size:12px}
main{flex:1;display:flex;align-items:center;padding:35px 0 70px}
.card{width:100%;min-height:620px;background:#e6ebdc;border-radius:30px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:45px;padding:70px 75px;align-items:center}
.card:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(188,215,142,.18);filter:blur(20px);right:-130px;top:-150px}
.left,.right{position:relative;z-index:1}
.kicker{font-size:10px;letter-spacing:2.4px;color:#5f7959;font-weight:700;margin-bottom:18px}
h1{font-size:64px;line-height:.98;letter-spacing:-3px;max-width:520px;margin-bottom:20px}
h1 em{font-family:'Playfair Display',serif;color:#578653;font-weight:500}
.desc{font-size:15px;line-height:1.8;color:#718078;max-width:500px;margin-bottom:30px}
.steps{display:flex;gap:32px;margin-top:40px}.step b{font-size:20px;color:#5b8a55}.step span{display:block;font-size:9px;letter-spacing:1.5px;color:#77847c;margin-top:5px}
.upload-box{background:rgba(255,255,255,.74);border:1px dashed #94aa8d;border-radius:22px;padding:28px;box-shadow:0 20px 55px rgba(29,57,37,.10)}
.drop{min-height:330px;border:1px solid #d4ddce;border-radius:17px;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;cursor:pointer;background:rgba(244,246,238,.72);overflow:hidden}
.drop.drag{border-color:#5c8c56;background:#edf4e8}.drop.has-image{padding:0}
.drop-content{display:flex;flex-direction:column;align-items:center;gap:12px}.icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#173b27;color:#c2e45a;font-size:28px}.drop h2{font-size:22px}.drop p{font-size:12px;color:#7a857e;line-height:1.6}.browse{display:inline-block;background:#153a27;color:white;border-radius:10px;padding:12px 20px;font-size:12px;font-weight:700;margin-top:6px}.hint{font-size:10px;color:#8a938d;margin-top:12px}
.preview{width:100%;height:100%;object-fit:cover;border-radius:16px}.hindi{font-family:'Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.file-name{font-size:11px;color:#6f7b73;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.continue{border:0;background:#173b27;color:#fff;padding:14px 24px;border-radius:10px;font-weight:700;font-size:11px;letter-spacing:1px;cursor:pointer}.continue:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:850px){.nav-links{display:none}.card{grid-template-columns:1fr;padding:45px 28px}.card{min-height:auto}h1{font-size:48px}.drop{min-height:280px}main{padding:20px 0 45px}}

/* Kisan Mitra language switch styling */
.lang-switch-modern,
#language-switch,
#lang-switch,
.language-switch,
.lang-switch {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid rgba(35, 70, 45, 0.22);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    color: #173b28;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(20, 50, 30, 0.08);
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
}
.lang-switch-modern:hover,
#language-switch:hover,
#lang-switch:hover,
.language-switch:hover,
.lang-switch:hover {
    background: #173b28;
    color: #d8f05b;
    border-color: #173b28;
    transform: translateY(-1px);
}

</style>
</head>
<body>
<div class="page">
<nav>
<a class="brand" href="{{ url_for('landingPage') }}"><img src="{{ url_for('static', filename='uploads/images/kisan-logo.png') }}" alt="Kisan Mitra logo"><div><strong>Kisan Mitra</strong><span>AI CROP HEALTH</span></div></a>
<div class="nav-links"><a href="{{ url_for('landingPage') }}" data-i18n="home">Home</a><a href="{{ url_for('landingPage') }}#process" data-i18n="howItWorks">HOW IT WORKS</a><a href="{{ url_for('landingPage') }}#about" data-i18n="about">About</a></div>
<a class="login" href="{{ url_for('login_page') }}" data-i18n="login">Login ↗</a>
</nav>
<main>
<section class="card">
<div class="left">
<div class="kicker" data-i18n="kicker">AI CROP HEALTH • DETECTION</div>
<h1 data-i18n="title">Upload your <em>crop.</em><br>Know its health.</h1>
<p class="desc" data-i18n="desc">Upload a clear photo of the affected crop leaf. Our crop disease detection system will use the image for analysis.</p>
<div class="steps"><div class="step"><b>01</b><span data-i18n="upload">UPLOAD</span></div><div class="step"><b>02</b><span data-i18n="analyze">ANALYZE</span></div><div class="step"><b>03</b><span data-i18n="understand">UNDERSTAND</span></div></div>
</div>
<div class="right">
<div class="upload-box">
<label class="drop" id="drop" for="fileInput">
<div class="drop-content" id="dropContent"><div class="icon">↑</div><h2 data-i18n="uploadPhoto">Upload crop photo</h2><p data-i18n="choosePhoto">Choose a clear image of the affected crop leaf.</p><span class="browse" data-i18n="chooseImage">Choose Image</span><span class="hint" data-i18n="fileTypes">JPG, JPEG or PNG</span></div>
</label>
<input id="fileInput" type="file" accept="image/png,image/jpeg,image/jpg" hidden>
<div class="actions"><span class="file-name" id="fileName" data-i18n="noImage">No image selected</span><button class="continue" id="continueBtn" disabled data-i18n="continue">CONTINUE ↗</button></div>
</div>
</div>
</section>
</main>
</div>
<script>
const input=document.getElementById('fileInput');
const drop=document.getElementById('drop');
const content=document.getElementById('dropContent');
const name=document.getElementById('fileName');
const btn=document.getElementById('continueBtn');
function showFile(file){
 if(!file || !file.type.startsWith('image/')) return;
 const url=URL.createObjectURL(file);
 drop.classList.add('has-image');
 drop.innerHTML='<img class="preview" src="'+url+'" alt="Selected crop image">';
 name.textContent=file.name;
 btn.disabled=false;
}
input.addEventListener('change',e=>showFile(e.target.files[0]));
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>showFile(e.dataTransfer.files[0]));

const translations={hi:{
 home:'होम',howItWorks:'कैसे काम करता है',about:'हमारे बारे में',login:'लॉगिन ↗',
 kicker:'AI फसल स्वास्थ्य • पहचान',title:'अपनी <em>फसल</em> अपलोड करें।<br>उसकी सेहत जानें।',
 desc:'प्रभावित फसल के पत्ते की साफ तस्वीर अपलोड करें। हमारा फसल रोग पहचान सिस्टम इस तस्वीर का विश्लेषण करेगा।',
 upload:'अपलोड',analyze:'विश्लेषण',understand:'समझें',uploadPhoto:'फसल की तस्वीर अपलोड करें',
 choosePhoto:'प्रभावित फसल के पत्ते की साफ तस्वीर चुनें।',chooseImage:'तस्वीर चुनें',fileTypes:'JPG, JPEG या PNG',
 noImage:'कोई तस्वीर चुनी नहीं गई',continue:'जारी रखें ↗'
}};
function applyHindi(){
 document.documentElement.lang='hi';document.body.classList.add('hindi');
 document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;if(translations.hi[key])el.innerHTML=translations.hi[key]});
}
if(localStorage.getItem('kmLanguage')==='hi')applyHindi();
</script>
</body>
</html>
