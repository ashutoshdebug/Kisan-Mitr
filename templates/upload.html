{% extends "index.html" %} 
{% block subtitle %} Upload Image {% endblock subtitle %} 

{% block styles %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/upload.css') }}"
/>
{% endblock %} 

{% block content %}
<form action="" id="uploadForm" enctype="multipart/form-data" method="post">
  <div id="drag_n_drop_container">
    <div id="dragNdrop">
      <label for="fileInput" id="fileInputBox" style="cursor: pointer;">
        <div id="dndHeader">
          Drag and Drop your files here
          <p>or click to browse your files</p>
          <input 
            type="file" 
            name="fileInput" 
            id="fileInput" 
            accept="image/png, image/jpg, image/jpeg, image/webp" 
            style="display: none;"
          >
          <span id="filename">Selected File: None</span>
        </div> 
        <div id="filetype">
          <p>Supported file type: PNG, JPG, JPEG or WEBP</p>
          <span id="warning">Please select a file first</span>
        </div>
      </label>
    </div>
    <div id="upload">
      <button type="submit" id="uploadBtn">Submit</button>
      <button type="reset" id="clear">Clear</button>
    </div>
  </div>
</form>
{% endblock content %} 

{% block jsscript %} 
<script>
  const fileInput = document.getElementById('fileInput');
  const uploadForm = document.getElementById('uploadForm');
  const fileNameSpan = document.getElementById('filename');
  const dragNdrop = document.getElementById('dragNdrop');
  const warning = document.getElementById('warning');

  let selectedFile = null;

  function updateFileInfo(file) {
    if (file) {
      selectedFile = file;
      warning.classList.remove('display_block');
      fileNameSpan.textContent = `Selected File: ${file.name}`;
      console.log(file.name);
    }
  }

  uploadForm.addEventListener('submit', (e) => {
    if (!selectedFile) {
      e.preventDefault();
      warning.classList.add('display_block');
      console.log("Select a file first then submit");
    }
  });
  
  fileInput.addEventListener('change', (event) => {
    if (event.target.files && event.target.files.length > 0) {
      updateFileInfo(event.target.files[0]);
    }
  });
  
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dragNdrop.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, false);
  });
  
  ['dragenter', 'dragover'].forEach(eventName => {
    dragNdrop.addEventListener(eventName, () => dragNdrop.classList.add('highlight'), false);
  });
  
  ['dragleave', 'drop'].forEach(eventName => {
    dragNdrop.addEventListener(eventName, () => dragNdrop.classList.remove('highlight'), false);
  });
  
  dragNdrop.addEventListener('drop', (e) => {
    const droppedFiles = e.dataTransfer.files;
    if (droppedFiles && droppedFiles.length > 0) {
      fileInput.files = droppedFiles; 
      updateFileInfo(droppedFiles[0]);
    }
  });
  
  uploadForm.addEventListener('reset', () => {
    selectedFile = null;
    fileNameSpan.textContent = 'Selected File: None';
    warning.classList.remove('display_block');
  });
</script>
{% endblock jsscript %}
