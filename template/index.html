<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll/bundled/locomotive-scroll.css" />
  <title>Kisan Mitr | Your own farming buddy!</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    color: black;
    font-family:
      /* "Open Sans", */
      "Hammersmith One", sans-serif;
  }

  ::selection {
    background-color: #54b03f;
  }

  /* html {
    min-height: 150vh;
    } */

  body {
    background: #d9e1e3;
    padding: 0.5vw;
  }

  #body-div {
    background-image: url("../static/uploads/kisan_bg.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    /* border-radius: 0.2vw; */
  }

  a {
    text-decoration: none;
  }

  #floating-nav {
    padding: 1vw;
    display: flex;
    justify-content: center;
  }

  #navbar {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 90%;
    min-height: 2vh;
    max-height: 5vh;
    padding: 1vw;
    border-radius: 0.5vw;
    position: fixed;
  }

  #navbar {
    background: #9ad64c;
    font-weight: bold;
  }

  #navbar #nav-left {
    width: 50%;
  }

  #navbar #nav-right {
    width: 50%;
  }

  #navbar #nav-right ul {
    display: flex;
    list-style: none;
    justify-content: space-evenly;
  }

  main {
    min-height: 100vh;
    height: 100vh;
  }

  #hero-section {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .heading {
    display: flex;
    align-items: center;
    flex-direction: column;
  }

  .heading div span{
    display: inline-block;
    font-weight: bold;
    color: white;
    font-size: 7vw;
    mix-blend-mode: difference;
    background: transparent;
  }

  .heading p {
    color: white;
    /* text-shadow: -1px -1px 0 #000,
      1px -1px 0 #000,
      -1px 1px 0 #000,
      1px 1px 0 #000; */
  }
</style>

<body>
  <div id="body-div" data-scroll-container>
    <header>
      <nav>
        <div id="floating-nav">
          <div id="navbar">
            <div id="nav-left">
              <span><a href="#">Kisan Mitra</a></span>
            </div>
            <div id="nav-right">
              <ul>
                <li><a href="#">Our Motive</a></li>
                <li><a href="#">User</a></li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section id="hero-section" data-scroll-section>
        <div class="heading">
          <div>
            <span data-scroll data-scroll-speed = "0.5">K</span><span data-scroll data-scroll-speed = "0.51">i</span><span data-scroll data-scroll-speed = "0.52">s</span><span data-scroll data-scroll-speed = "0.8">a</span><span data-scroll data-scroll-speed = "0.54">n</span><span data-scroll data-scroll-speed = "0.55">&nbsp;</span><span data-scroll data-scroll-speed = "0.56">M</span><span data-scroll data-scroll-speed = "0.57">i</span><span data-scroll data-scroll-speed = "0.5">t</span><span data-scroll data-scroll-speed = "0.58">r</span><span data-scroll data-scroll-speed = "0.8">a</span>
          </div>
          <p>
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. Minima unde maiores ut dolor accusantium explicabo
            ipsa officiis odit fuga facere?
          </p>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll/bundled/locomotive-scroll.min.js"></script>
  <script>
    const scroll = new LocomotiveScroll({
      el: document.querySelector("[data-scroll-container]"),
      smooth: true,
    });
  </script>
</body>

</html>
